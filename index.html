<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一个 GitHub 网站</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #6dd5ed, #2193b0);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .box {
      background: rgba(255, 255, 255, 0.15);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      max-width: 600px;
    }
    h1 {
      margin-bottom: 15px;
      font-size: 2.5rem;
    }
    p {
      font-size: 1.2rem;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>你好，GitHub Pages！</h1>
    <p>这是我的第一个 github.io 网站。</p>
    <p>我已经成功把网站发布到 GitHub 上了。</p>
  </div>
</body>
</html>
